<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 03: Filtro y Orden de Productos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6a00 0%, #ee0979 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ee0979;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #ee0979; margin-bottom: 10px; }
        .descripcion { color: #666; margin-bottom: 20px; }
        h2 { margin: 20px 0 10px; color: #444; font-size: 1.1em; }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← Volver al inicio</a>
        <h1>🛍️ Filtro y Orden de Productos</h1>
        <p class="descripcion">Práctica de <code>filter()</code>, <code>sort()</code>, <code>map()</code> y otros métodos de arreglos.</p>

        <h2>Salida en consola:</h2>
        <pre id="output"></pre>
    </div>

    <script>
        const output = document.getElementById('output');
        const originalLog = console.log;
        console.log = function(...args) {
            // Convertimos los objetos a JSON legible
            const formateado = args.map(arg => {
                if (typeof arg === 'object' && arg !== null) {
                    return JSON.stringify(arg, null, 2);
                }
                return arg;
            }).join(' ');
            output.textContent += formateado + '\n';
            originalLog.apply(console, args);
        };

        // Redirigimos también console.table
        const originalTable = console.table;
        console.table = function(data) {
            if (Array.isArray(data)) {
                data.forEach((item, i) => {
                    output.textContent += `   [${i}] ${JSON.stringify(item)}\n`;
                });
                output.textContent += '\n';
            } else {
                output.textContent += JSON.stringify(data, null, 2) + '\n';
            }
            originalTable.apply(console, arguments);
        };
    </script>

    <script src="tienda.js"></script>
</body>
</html>
