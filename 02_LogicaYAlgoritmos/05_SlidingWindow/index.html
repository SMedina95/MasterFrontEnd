<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 05: Sliding Window - Palabra Más Larga</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2c5364;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
        h1 { color: #0f2027; margin-bottom: 10px; }
        .descripcion { color: #666; margin-bottom: 20px; }
        h2 { margin: 20px 0 10px; color: #444; font-size: 1.1em; }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← Volver al inicio</a>
        <h1>🔍 Sliding Window: Palabra Más Larga</h1>
        <p class="descripcion">Encuentra la palabra más larga de un texto usando la técnica de ventana deslizante.</p>

        <h2>Salida en consola:</h2>
        <pre id="output"></pre>
    </div>

    <script>
        const output = document.getElementById('output');
        const originalLog = console.log;
        console.log = function(...args) {
            output.textContent += args.join(' ') + '\n';
            originalLog.apply(console, args);
        };
    </script>

    <script src="sliding-window.js"></script>
</body>
</html>
