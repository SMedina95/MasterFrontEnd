<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 06: Validación con Zod</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Incluimos Zod desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← Volver al inicio</a>

        <header>
            <h1>🔐 Registro con Validación Zod</h1>
            <p class="subtitulo">Los datos se validan con esquemas tipados antes de enviarse.</p>
        </header>

        <form id="registerForm" novalidate>
            <!-- Nombre -->
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" id="name" placeholder="Tu nombre" />
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="Tu correo" />
            </div>

            <!-- Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Contraseña (mín. 6 caracteres)" />
            </div>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>

        <!-- Contenedor de errores -->
        <div id="errors" class="errors-container"></div>

        <!-- Mensaje de éxito -->
        <div id="successMessage" class="success-message hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
