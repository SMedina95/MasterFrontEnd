<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 08: Biblioteca CRUD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="back-link">← Volver al inicio</a>

        <header>
            <h1>📚 Biblioteca Personal</h1>
            <p class="subtitulo">Gestiona tus libros: agrega, edita, elimina y administra sus capítulos.</p>
        </header>

        <!-- Formulario para agregar/editar libros -->
        <form id="formularioLibro" class="formulario">
            <h2 id="tituloFormulario">➕ Agregar Nuevo Libro</h2>
            <input type="hidden" id="libroId" />

            <div class="form-grid">
                <div class="form-group">
                    <label for="titulo">Título *</label>
                    <input type="text" id="titulo" placeholder="Ej: Cien años de soledad" required />
                </div>

                <div class="form-group">
                    <label for="autor">Autor *</label>
                    <input type="text" id="autor" placeholder="Ej: Gabriel García Márquez" required />
                </div>

                <div class="form-group">
                    <label for="anio">Año *</label>
                    <input type="number" id="anio" placeholder="Ej: 1967" min="0" max="2100" required />
                </div>

                <div class="form-group">
                    <label for="estado">Estado *</label>
                    <select id="estado" required>
                        <option value="disponible">Disponible</option>
                        <option value="prestado">Prestado</option>
                    </select>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" id="btnGuardar" class="btn btn-primary">💾 Guardar Libro</button>
                <button type="button" id="btnCancelar" class="btn btn-secondary" style="display: none;">
                    ✖ Cancelar
                </button>
            </div>
        </form>

        <!-- Lista de libros -->
        <section class="libros-section">
            <div class="libros-header">
                <h2>Mis Libros <span id="contadorLibros" class="contador">(0)</span></h2>
                <input type="text" id="buscador" placeholder="🔍 Buscar por título o autor..." class="buscador" />
            </div>

            <div id="listaLibros" class="lista-libros">
                <!-- Aquí se renderizarán los libros -->
            </div>
        </section>
    </div>

    <!-- Modal para gestionar capítulos -->
    <div id="modalCapitulos" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitulo">📖 Capítulos de: ...</h3>
                <button id="btnCerrarModal" class="btn-cerrar">✖</button>
            </div>

            <form id="formularioCapitulo" class="form-capitulo">
                <input type="text" id="nuevoCapitulo" placeholder="Ej: Capítulo 1: Macondo" required />
                <button type="submit" class="btn btn-primary">➕ Agregar</button>
            </form>

            <ul id="listaCapitulos" class="lista-capitulos">
                <!-- Aquí se renderizan los capítulos -->
            </ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
